name: logged

services:
  api:
    build: ./LoggedApi
    container_name: logged-api
    # Segredos do IGDB ficam no .env do próprio backend. Opcional: se não existir,
    # o app sobe normalmente (a busca de jogos fica indisponível).
    env_file:
      - path: ./LoggedApi/.env
        required: false
    environment:
      DATABASE_URL: sqlite:////data/logged.db
      UPLOAD_DIR: /data/uploads
      CORS_ORIGINS: '["http://localhost:5173","http://localhost:8000"]'
      # Fallback de instância (opcional): cada usuário pode ter a própria chave no app.
      TMDB_API_KEY: ${TMDB_API_KEY:-}
    volumes:
      - logged_data:/data
    ports:
      - "8000:8000"
    restart: unless-stopped

  web:
    build:
      context: ./LoggedApp
      # Sem build args de chave: as chaves de API são por usuário e ficam no backend.
      # O build usa URLs relativas ("/api/...") e o Nginx faz o proxy (same-origin).
    container_name: logged-web
    depends_on:
      - api
    ports:
      - "5173:80"
    restart: unless-stopped

volumes:
  logged_data:
